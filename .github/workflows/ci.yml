name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node --check lib/astro.mjs
          node --check assets/jieqi/scripts/astro.mjs
          node --check assets/jieqi/scripts/jieqi.mjs
      - name: Smoke
        run: node test/smoke.mjs
