name: 功能建议 / Feature request
description: 想要新的内容、交互或节气数据
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你想要什么
      placeholder: 例如：补《彖传》、加分享图、英文界面……
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么值得做
      placeholder: 使用场景、对谁有用
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 内容（节气 / 农历 / 六十四卦 / 养生）
        - 交互（拖拽 / 键盘 / 拖放）
        - 视觉（配色 / 排版）
        - 工程（测试 / 性能 / 文档）
        - 其他
  - type: input
    id: reference
    attributes:
      label: 参考资料（可选）
      placeholder: 出处、链接、截图
