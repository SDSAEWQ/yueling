<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月令 · 截图台</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0b0e;
    color: #e9e9ee;
    font: 13px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    overflow: hidden;
  }
  #backdrop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(760px 460px at 16% 8%, rgba(88, 116, 255, 0.10), transparent 62%),
      radial-gradient(680px 520px at 84% 92%, rgba(88, 116, 255, 0.05), transparent 64%),
      linear-gradient(180deg, #0b0c10 0%, #08090c 100%);
  }
  /* The card docks under the conversation header rail. */
  #header {
    position: fixed;
    left: 120px;
    right: 120px;
    top: 6px;
    height: 34px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
  }
  #header [data-conversation-header-leading] {
    display: block;
    width: 240px;
    height: 100%;
  }
  /* A quiet composer silhouette so the card has somewhere to sit. */
  #composer {
    position: fixed;
    left: 140px;
    right: 140px;
    bottom: 24px;
    height: 78px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.015);
  }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="header"><div data-conversation-header-leading></div></div>
  <div id="composer"></div>
  <div id="root"></div>
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script>
    window.__ModuleLoader__ = {
      load: function (definition) { window.__jieqiDefinition = definition },
    }
  </script>
  <script src="client.js"></script>
  <script src="harness.js"></script>
</body>
</html>
